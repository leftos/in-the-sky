# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
default_install_hook_types = ["pre-commit", "commit-msg"]

# default_install_hook_types installs a commit-msg hook as well as a pre-commit one, and the builtins tidy the files
# rather than the message: without a stage of their own the commit-msg hooks would run them over the tree a second time.
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", stages = ["pre-commit"] },
    { id = "end-of-file-fixer", stages = ["pre-commit"] },
    { id = "check-merge-conflict", stages = ["pre-commit"] },
    { id = "detect-private-key", stages = ["pre-commit"] },
    { id = "check-added-large-files", args = ["--maxkb=1024"], stages = ["pre-commit"] },
]

[[repos]]
repo = "local"

# Order matters: the Agent Mail lease guard refuses a commit on another session's leased file before any local hook runs,
# the fixers run and re-stage next, the readers report on the result, the warnings-as-errors build gates it, and the
# doc-drift check closes, always_run so a docs-only commit is checked too. Both C# wrappers `git add` what
# they changed so the commit proceeds instead of failing with "files were modified by this hook". They are pwsh because
# prek launched from PowerShell on Windows can hand a bash hook the WSL stub, which has no dotnet.

[[repos.hooks]]
id = "agent-mail-guard"
name = "agent-mail lease guard"
entry = "pwsh tools/hooks/Invoke-AgentMailGuard.ps1"
language = "system"
pass_filenames = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "dotnet-format-style"
name = "dotnet format style (info)"
entry = "pwsh tools/hooks/dotnet-format-wrapper.ps1 style"
language = "system"
types = ["c#"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "csharpier"
name = "dotnet csharpier format"
entry = "pwsh tools/hooks/csharpier-wrapper.ps1"
language = "system"
types = ["c#"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "psscriptanalyzer"
name = "PSScriptAnalyzer"
entry = "pwsh tools/hooks/Invoke-ScriptAnalyzerHook.ps1"
language = "system"
types = ["powershell"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "line-length"
name = "line length (150)"
entry = "pwsh tools/hooks/Test-LineLength.ps1"
language = "system"
types_or = ["c#", "powershell", "python"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "gitleaks"
name = "gitleaks (staged)"
entry = "gitleaks git --pre-commit --staged --redact --no-banner"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "provenance"
name = "asset provenance ledger"
entry = "uv run --locked --project tools/provenance python -m provenance check"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "dotnet-build"
name = "dotnet build (warnings as errors)"
entry = "dotnet build -p:TreatWarningsAsErrors=true"
language = "system"
pass_filenames = false
# A commit of Markdown alone has nothing to build.
exclude = '\.md$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "doc-drift"
name = "docs name every project and every test class"
entry = "pwsh tools/hooks/Test-DocDrift.ps1"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "doc-drift-message"
name = "a content commit stages a design doc or says why"
entry = "pwsh tools/hooks/Test-DocDrift.ps1 -CommitMessage"
language = "system"
always_run = true
stages = ["commit-msg"]
